<div class="lang-switcher">
  <button class="lang-btn" (click)="toggleDropdown()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="lang-code">{{ currentLang.code | uppercase }}</span>
  </button>

  <div class="lang-dropdown" *ngIf="isOpen">
    <button *ngFor="let lang of languages" 
            class="lang-option" 
            [class.active]="lang.code === i18n.currentLocale()"
            (click)="changeLanguage(lang.code)">
      <span class="flag">{{ lang.flag }}</span>
      <span class="name">{{ lang.name }}</span>
    </button>
  </div>
</div>
